# Drei Dienste aus einer Datei: Datenbank, lokales Sprachmodell, Oberfläche im Browser.
# Start und jede Änderung: docker compose up -d   ·   Stoppen: docker compose down
# Vorher: env.example nach .env kopieren und ein eigenes Passwort eintragen.
services:
  postgres:   # Datenbank
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
  ollama:     # Sprachmodell
    image: ollama/ollama
    volumes:
      - modelle:/root/.ollama
  webui:      # Oberfläche im Browser: http://127.0.0.1:3000
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres/postgres
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pg: {}
  modelle: {}
