# Baut bei jedem Push auf main das fertige Image des Dev Containers – mit Claude Code
# aus dem Feature – und legt es öffentlich unter ghcr.io/neurawork-git/claude-dev-container ab.
name: Image bauen und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bei der GitHub Container Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Dev Container bauen und hochladen
        uses: devcontainers/ci@v0.3
        with:
          imageName: ghcr.io/${{ github.repository }}
          imageTag: latest
          cacheFrom: ghcr.io/${{ github.repository }}
          push: always
